<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body{
            background-color: #414141;
        }
        table{
            /* width: 100%; */
            border-collapse: collapse;
            /* ye table border ko khatam kr deta hai */
            color: #fff;
            text-align: center;
        }
        th,td{
            border: 1px solid #000;
            padding: 10px;
        }
        tr:nth-child(even){
            background-color: #212121;
        }
    </style>
</head>
<body>
     <table >
        <tr>
            <th>Country</th>
            <th>Code</th>
            <th>Name</th>
        </tr>
        <tr>
            <td>India</td>
            <td>+91</td>
            <td>Adil</td>
        </tr>
        <tr>
            <td>India</td>
            <td>+91</td>
            <td>Adil</td>
        </tr>
        <tr>
            <td>India</td>
            <td>+91</td>
            <td>Adil</td>
        </tr>
     </table>
</body>
</html>
